name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Gate — tests
        run: npm test

      - name: Gate — repo invariants
        run: node tools/check.mjs

      - uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p _site
          cp -R site/. _site/
          # Pages serves 404.html for unknown paths; keep deep links in-app.
          test -f _site/404.html || cp _site/index.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
