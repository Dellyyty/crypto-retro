<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e28144"/>
      <stop offset="1" stop-color="#332370"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332370"/>
      <stop offset="1" stop-color="#22345c"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#000"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#sky)"/>

  <!-- masthead band -->
  <rect x="0" y="0" width="1200" height="118" fill="url(#band)"/>
  <path d="M900 0 L1200 0 L1200 118 Z" fill="#332370"/>
  <g transform="translate(56 26)">
    <rect x="0" y="0" width="66" height="66" rx="8" fill="#241a4d" stroke="#000" stroke-width="4"/>
    <path d="M33 10a23 23 0 1 0 0 46 19 19 0 1 1 0-46Z" fill="#ffd766" stroke="#000" stroke-width="3"/>
    <path d="M45 19c7 4 11 10 11 15M48 28c4 2 6 5 6 8" fill="none" stroke="#ffff6f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="140" y="78" font-family="ui-monospace, monospace" font-size="52" font-weight="800" letter-spacing="-2" fill="#ffff6f">CRYPTO<tspan fill="#ffffff">CAST</tspan></text>
  <text x="1144" y="72" text-anchor="end" font-family="ui-monospace, monospace" font-size="20" font-weight="600" fill="#ffffff" opacity="0.85">LIVE BROADCAST</text>

  <!-- condition panel -->
  <rect x="56" y="162" width="1088" height="330" fill="#354e84" stroke="#000" stroke-width="4"/>
  <rect x="70" y="176" width="1060" height="302" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <text x="100" y="232" font-family="ui-monospace, monospace" font-size="20" fill="#8fd0ff" letter-spacing="4">CURRENT CONDITIONS</text>
  <text x="100" y="330" font-family="ui-monospace, monospace" font-size="92" font-weight="300" fill="#ffffff">$75,681</text>
  <text x="100" y="382" font-family="ui-monospace, monospace" font-size="28" fill="#ffffff">P CLOUDY / <tspan fill="#ff8f8f">-0.13%</tspan></text>

  <g transform="translate(830 300)">
    <path d="M-96 44a48 48 0 0 1 11.4-94.2A66 66 0 0 1 34-6a45 45 0 0 1 9 88.8H-96Z" fill="#cfd9f0" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
    <path d="M-78 76h120" stroke="#9ec5ff" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="20" fill="#ffffff">
    <text x="700" y="212" fill="#ffff6f">BITCOIN</text>
    <text x="700" y="250">DOMINANCE</text><text x="1096" y="250" text-anchor="end" font-weight="700">59.3%</text>
    <text x="700" y="286">VOLUME 24H</text><text x="1096" y="286" text-anchor="end" font-weight="700">$41.13B</text>
    <text x="700" y="322">FEAR / GREED</text><text x="1096" y="322" text-anchor="end" font-weight="700">25 EXT. FEAR</text>
    <text x="700" y="358">HASHRATE</text><text x="1096" y="358" text-anchor="end" font-weight="700">1007 EH/S</text>
  </g>

  <!-- ticker -->
  <rect x="0" y="536" width="1200" height="94" fill="#354e84" stroke="#000" stroke-width="3"/>
  <rect x="0" y="538" width="1200" height="3" fill="#ffffff" opacity="0.9"/>
  <text x="56" y="594" font-family="ui-monospace, monospace" font-size="26" fill="#ffffff" letter-spacing="1">BTC $75,681 ▼0.13%  ●  ETH $2,231 ▼1.10%  ●  GAS 13.2 GWEI  ●  BLOCK 974,947</text>
  <rect x="1112" y="554" width="52" height="52" fill="#00ff4c" stroke="#000" stroke-width="2"/>

  <!-- crt -->
  <rect width="1200" height="630" fill="url(#scan)"/>
  <rect width="1200" height="630" fill="none" stroke="#000" stroke-width="54" opacity="0.55"/>
