name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pure-function tests
        run: npm test

      - name: Repo invariants
        run: node tools/check.mjs

      - name: Verify no runtime dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            if (pkg.dependencies && Object.keys(pkg.dependencies).length) {
              console.error("runtime dependencies are not allowed:", pkg.dependencies);
              process.exit(1);
            }
            console.log("no runtime dependencies");
          '

      - name: Verify site boots without a build step
        run: |
          node tools/serve.mjs &
          SERVER=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/index.html > /dev/null && break
            sleep 0.2
          done
          for path in / /styles/broadcast.css /scripts/app.js /scripts/lib/api.js \
                      /assets/fonts/martian-mono-latin.woff2 /assets/img/og.png \
                      /sw.js /assets/manifest.webmanifest /data.html /infra.html /design.html; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080$path")
            echo "$code $path"
            test "$code" = "200" || exit 1
          done
          kill $SERVER
